# Offshoot local stack. See docs/ARCHITECTURE_DECISIONS.md (ADR-009) for how
# the two runner services are isolated.
name: offshoot

x-runner-hardening: &runner-hardening
  user: "10001:10001"
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  pids_limit: 512

services:
  postgres:
    image: postgres:17.11-trixie@sha256:3b0cda93be7c8dba2ed484d19393d93845dc3dafb88973e248ba8e6d99d784e1
    command: ["postgres", "-c", "timezone=UTC", "-c", "log_timezone=UTC"]
    environment:
      POSTGRES_DB: offshoot
      POSTGRES_USER: offshoot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env}
      APP_DB_ROLE: ${APP_DB_ROLE:-offshoot_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?copy .env.example to .env}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U offshoot -d offshoot"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - backend

  orchestrator:
    build:
      context: ./orchestrator
    environment:
      APP_ENV: ${APP_ENV:-development}
      DEMO_MODE: ${DEMO_MODE:-true}
      AI_MODE: ${AI_MODE:-mock}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-60}
      AI_PROJECT_CALL_BUDGET: ${AI_PROJECT_CALL_BUDGET:-50}
      APP_DB_ROLE: ${APP_DB_ROLE:-offshoot_app}
      DATABASE_URL: postgresql+psycopg://${APP_DB_ROLE:-offshoot_app}:${APP_DB_PASSWORD}@postgres:5432/offshoot
      MIGRATION_DATABASE_URL: postgresql+psycopg://offshoot:${POSTGRES_PASSWORD}@postgres:5432/offshoot
      JWT_SECRET: ${JWT_SECRET:?copy .env.example to .env}
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-900}
      REFRESH_TOKEN_TTL_SECONDS: ${REFRESH_TOKEN_TTL_SECONDS:-604800}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4200}
      LOGIN_RATE_LIMIT_PER_MINUTE: ${LOGIN_RATE_LIMIT_PER_MINUTE:-10}
      DEMO_PASSWORD_VIEWER: ${DEMO_PASSWORD_VIEWER:?copy .env.example to .env}
      DEMO_PASSWORD_ENGINEER: ${DEMO_PASSWORD_ENGINEER:?copy .env.example to .env}
      DEMO_PASSWORD_ARCHITECT: ${DEMO_PASSWORD_ARCHITECT:?copy .env.example to .env}
      DEMO_PASSWORD_ADMIN: ${DEMO_PASSWORD_ADMIN:?copy .env.example to .env}
      BILLRITE_PATH: /legacy/billrite
      COBOL_RUNNER_URL: http://cobol-runner:9000
      DOTNET_BUILDER_SOCKET: /run/builder/builder.sock
      RUNNER_SHARED_SECRET: ${RUNNER_SHARED_SECRET:?copy .env.example to .env}
      FACADE_SHARED_SECRET: ${FACADE_SHARED_SECRET:?copy .env.example to .env}
      FACADE_URL: http://facade:8080
      WATCHFILES_FORCE_POLLING: "true"
    ports:
      - "127.0.0.1:${ORCHESTRATOR_HOST_PORT:-8100}:8000"
    volumes:
      - ./orchestrator:/app
      - ./legacy/billrite:/legacy/billrite:ro
      - ./scripts:/repo-scripts:ro
      # The builder has no network at all; its API is a Unix socket in this volume (ADR-030).
      - builder-socket:/run/builder:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/healthz', timeout=3)"
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - backend
      - sandbox

  frontend:
    build:
      context: ./frontend
    environment:
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-4200}:4200"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.angular
      - /app/dist
    depends_on:
      orchestrator:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:4200/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks:
      - backend

  facade:
    build:
      context: .
      dockerfile: modern/src/Offshoot.Facade/Dockerfile
    # The strangler facade (ADR-039). It never runs generated code itself: legacy goes to
    # cobol-runner and modern to dotnet-builder, both in their sandboxes.
    user: "10002:10002"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 512m
    tmpfs:
      - /tmp:uid=10002,gid=10002,mode=0700,size=64m
    environment:
      ORCHESTRATOR_URL: http://orchestrator:8000
      COBOL_RUNNER_URL: http://cobol-runner:9000
      DOTNET_BUILDER_SOCKET: /run/builder/builder.sock
      RUNNER_SHARED_SECRET: ${RUNNER_SHARED_SECRET:?copy .env.example to .env}
      FACADE_SHARED_SECRET: ${FACADE_SHARED_SECRET:?copy .env.example to .env}
    ports:
      - "127.0.0.1:${FACADE_HOST_PORT:-8200}:8080"
    volumes:
      - builder-socket:/run/builder:ro
    depends_on:
      orchestrator:
        condition: service_healthy
      cobol-runner:
        condition: service_healthy
      dotnet-builder:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /healthz HTTP/1.0\r\n\r\n' >&3 && grep -q ' 200 ' <&3"
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - backend
      - sandbox

  cobol-runner:
    <<: *runner-hardening
    build:
      context: .
      dockerfile: runners/cobol-runner/Dockerfile
    # Reachable only over this internal network. No published ports.
    networks:
      - sandbox
    environment:
      RUNNER_SHARED_SECRET: ${RUNNER_SHARED_SECRET:?copy .env.example to .env}
    working_dir: /app/billrite
    cpus: "1.0"
    mem_limit: 512m
    tmpfs:
      - /work:uid=10001,gid=10001,mode=0700,size=128m,exec
      - /tmp:uid=10001,gid=10001,mode=0700,size=64m
    volumes:
      - ./legacy/billrite:/app/billrite:ro
      - ./legacy/billrite/out:/out
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:9000/healthz', timeout=3)"
      interval: 5s
      timeout: 5s
      retries: 30

  dotnet-builder:
    <<: *runner-hardening
    build:
      context: .
      dockerfile: runners/dotnet-builder/Dockerfile
    # No network interface but loopback (ADR-030). The API is a Unix socket in a volume.
    network_mode: none
    environment:
      RUNNER_SHARED_SECRET: ${RUNNER_SHARED_SECRET:?copy .env.example to .env}
    cpus: "2.0"
    mem_limit: 3g
    tmpfs:
      - /work:uid=10001,gid=10001,mode=0700,size=768m,exec
      - /tmp:uid=10001,gid=10001,mode=0700,size=512m,exec
    volumes:
      - ./modern:/src/modern:ro
      - builder-socket:/run/builder
    healthcheck:
      test: ["CMD", "python3", "/opt/runner/server.py", "healthcheck"]
      interval: 10s
      timeout: 10s
      retries: 12

networks:
  backend: {}
  sandbox:
    # No route out of the Docker host, and postgres and the frontend are not attached.
    internal: true

volumes:
  postgres-data: {}
  # tmpfs-backed, so the socket never persists and the builder's user owns it.
  builder-socket:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "uid=10001,gid=10001,mode=0755,size=1m"
