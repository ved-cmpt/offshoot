# LegacyLens local stack. See docs/ARCHITECTURE_DECISIONS.md (ADR-009) for how
# the two runner services are isolated.
name: legacylens

x-runner-hardening: &runner-hardening
  user: "10001:10001"
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  pids_limit: 512
  # Reachable only over this internal network. No published ports.
  networks:
    - sandbox

services:
  postgres:
    image: postgres:17.11-trixie@sha256:3b0cda93be7c8dba2ed484d19393d93845dc3dafb88973e248ba8e6d99d784e1
    command: ["postgres", "-c", "timezone=UTC", "-c", "log_timezone=UTC"]
    environment:
      POSTGRES_DB: legacylens
      POSTGRES_USER: legacylens
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?copy .env.example to .env}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legacylens -d legacylens"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - backend

  orchestrator:
    build:
      context: ./orchestrator
    environment:
      APP_ENV: ${APP_ENV:-development}
      DEMO_MODE: ${DEMO_MODE:-true}
      AI_MODE: ${AI_MODE:-mock}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      DATABASE_URL: postgresql+psycopg://legacylens_app:${APP_DB_PASSWORD}@postgres:5432/legacylens
      MIGRATION_DATABASE_URL: postgresql+psycopg://legacylens:${POSTGRES_PASSWORD}@postgres:5432/legacylens
      JWT_SECRET: ${JWT_SECRET:?copy .env.example to .env}
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-900}
      REFRESH_TOKEN_TTL_SECONDS: ${REFRESH_TOKEN_TTL_SECONDS:-604800}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4200}
      LOGIN_RATE_LIMIT_PER_MINUTE: ${LOGIN_RATE_LIMIT_PER_MINUTE:-10}
      DEMO_PASSWORD_VIEWER: ${DEMO_PASSWORD_VIEWER:?copy .env.example to .env}
      DEMO_PASSWORD_ENGINEER: ${DEMO_PASSWORD_ENGINEER:?copy .env.example to .env}
      DEMO_PASSWORD_ARCHITECT: ${DEMO_PASSWORD_ARCHITECT:?copy .env.example to .env}
      DEMO_PASSWORD_ADMIN: ${DEMO_PASSWORD_ADMIN:?copy .env.example to .env}
      BILLRITE_PATH: /legacy/billrite
      COBOL_RUNNER_URL: http://cobol-runner:9000
      WATCHFILES_FORCE_POLLING: "true"
    ports:
      - "127.0.0.1:${ORCHESTRATOR_HOST_PORT:-8100}:8000"
    volumes:
      - ./orchestrator:/app
      - ./legacy/billrite:/legacy/billrite:ro
      - ./scripts:/repo-scripts:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/healthz', timeout=3)"
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - backend
      - sandbox

  frontend:
    build:
      context: ./frontend
    environment:
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-4200}:4200"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.angular
      - /app/dist
    depends_on:
      orchestrator:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:4200/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks:
      - backend

  cobol-runner:
    <<: *runner-hardening
    build:
      context: .
      dockerfile: runners/cobol-runner/Dockerfile
    working_dir: /app/billrite
    cpus: "1.0"
    mem_limit: 512m
    tmpfs:
      - /work:uid=10001,gid=10001,mode=0700,size=128m,exec
      - /tmp:uid=10001,gid=10001,mode=0700,size=64m
    volumes:
      - ./legacy/billrite:/app/billrite:ro
      - ./legacy/billrite/out:/out
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:9000/healthz', timeout=3)"
      interval: 5s
      timeout: 5s
      retries: 30

  dotnet-builder:
    <<: *runner-hardening
    build:
      context: .
      dockerfile: runners/dotnet-builder/Dockerfile
    cpus: "2.0"
    mem_limit: 2g
    tmpfs:
      - /work:uid=10001,gid=10001,mode=0700,size=512m,exec
      - /tmp:uid=10001,gid=10001,mode=0700,size=512m
    volumes:
      - ./modern:/src/modern:ro
    healthcheck:
      test: ["CMD-SHELL", "dotnet --list-sdks >/dev/null && test -x /usr/local/bin/nonet"]
      interval: 10s
      timeout: 10s
      retries: 12

networks:
  backend: {}
  sandbox:
    # No route out of the Docker host, and postgres and the frontend are not attached.
    internal: true

volumes:
  postgres-data: {}
