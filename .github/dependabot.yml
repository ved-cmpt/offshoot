# Monthly, grouped and few, so the free CI minutes go to real work (ADR-049). Every update
# still has to pass CI, and versions are reviewed by hand before merging.
version: 2
updates:
  - package-ecosystem: uv
    directory: /orchestrator
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      angular:
        patterns: ["@angular/*", "@angular-devkit/*", "angular-eslint", "typescript"]
      frontend:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      e2e:
        patterns: ["*"]
  - package-ecosystem: nuget
    directories: ["/modern", "/runners/dotnet-builder/template"]
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      dotnet:
        patterns: ["*"]
  - package-ecosystem: docker
    directories: ["/", "/orchestrator", "/frontend", "/runners/cobol-runner", "/runners/dotnet-builder", "/modern/src/Offshoot.Facade"]
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ["*"]
