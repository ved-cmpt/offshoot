# Monthly, one grouped pull request per ecosystem at most, so the free CI minutes go to real
# work (ADR-049). Every update still has to pass CI and is reviewed by hand before merging.
# Major upgrades, and Python past 3.12 (Blueprint Section 2.4), are left to a deliberate decision.
version: 2
updates:
  - package-ecosystem: uv
    directory: /orchestrator
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      all:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directories: ["/frontend", "/e2e"]
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      all:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: nuget
    directories: ["/modern", "/runners/dotnet-builder/template"]
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      all:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directories: ["/", "/orchestrator", "/frontend", "/runners/cobol-runner", "/runners/dotnet-builder", "/modern/src/Offshoot.Facade"]
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      all:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "python"
        versions: [">= 3.13"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      all:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
