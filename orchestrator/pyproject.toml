[project]
name = "parityforge-orchestrator"
version = "0.1.0"
description = "ParityForge orchestrator API"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi==0.162.0", "uvicorn[standard]==0.54.0", "sqlalchemy==2.1.8", "alembic==1.20.1", "psycopg[binary]==3.3.8", "pydantic==2.14.2", "pydantic-settings==2.16.2", "argon2-cffi==25.1.0", "pyjwt==2.15.1", "httpx==0.28.1", "google-genai==2.34.0", "hypothesis==6.170.14", "python-multipart==0.0.32"]

[dependency-groups]
dev = ["pytest==9.2.0", "ruff==0.17.3", "mypy==2.4.1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "C4", "SIM", "RET", "PL"]
ignore = ["PLR0913", "PLR0917", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S107", "S608", "PLC0415"]
"alembic/versions/*" = ["E501", "S608"]
"app/scripts/**" = ["T201"]
# Lazy on purpose: mock mode must never import the provider SDK.
"app/services/agent/gemini.py" = ["PLC0415"]
"app/services/agent/provider.py" = ["PLC0415"]
# A parser's statement dispatch reads better as one flat chain.
"app/services/analysis/*" = ["PLR0912"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "tests"]
